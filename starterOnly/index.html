<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reservation</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="modal.css" />
  </head>
  <body>
    <div class="bground">
      <div class="content">
        <span class="close"></span>
        <div class="modal-body">
          <form
            name="reserve"
            action="index.html"
            method="get"
            onsubmit="return validate();"
            novalidate
          >
            <div class="formData">
              <label for="first">Prénom</label><br />
              <input
                class="text-control"
                type="text"
                id="first"
                name="first"
                minlength="2"
                required
              /><br />
            </div>

            <div class="formData">
              <label for="last">Nom</label><br />
              <input
                class="text-control"
                type="text"
                id="last"
                name="last"
                minlength="2"
                required
              /><br />
            </div>

            <div class="formData">
              <label for="email">E-mail</label><br />
              <input
                class="text-control"
                type="email"
                id="email"
                name="email"
                required
              /><br />
            </div>

            <div class="formData">
              <label for="birthdate">Date de naissance</label><br />
              <input
                class="text-control"
                type="date"
                id="birthdate"
                name="birthdate"
                required
              /><br />
            </div>

            <div class="formData">
              <label for="quantity"
                >À combien de tournois GameOn avez-vous déjà participé ?</label
              ><br />
              <input
                type="number"
                class="text-control"
                id="quantity"
                name="quantity"
                required
              /><br />
            </div>

            <p class="text-label">
              À quel tournoi souhaitez-vous participer cette année ?
            </p>
            <div class="formData">
              <input
                class="checkbox-input"
                type="radio"
                id="location1"
                name="location"
                value="New York"
                required
              />
              <label class="checkbox-label" for="location1">
                <span class="checkbox-icon"></span>
                New York
              </label>
            </div>

            <div class="formData">
              <input
                class="checkbox-input"
                type="checkbox"
                id="checkbox1"
                name="terms"
                required
              />
              <label class="checkbox2-label" for="checkbox1">
                <span class="checkbox-icon"></span>
                J'ai lu et accepté les conditions d'utilisation.
              </label>
              <br />
              <input
                class="checkbox-input"
                type="checkbox"
                id="checkbox2"
                name="newsletter"
              />
              <label class="checkbox2-label" for="checkbox2">
                <span class="checkbox-icon"></span>
                Je souhaite être prévenu des prochains événements.
              </label>
            </div>

            <input class="btn-submit" type="submit" value="C'est parti" />
          </form>
        </div>
      </div>
    </div>

    <script src="modal.js"></script>
  </body>
</html>
